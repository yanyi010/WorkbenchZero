<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 480" role="img" aria-label="One call, one gate: plugin requests pass the kernel's checklist">
  <defs>
    <marker id="sArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#39404B"/>
    </marker>
    <style>
      .t { font-family: Inter, 'Liberation Sans', 'DejaVu Sans', sans-serif; }
      .m { font-family: 'DejaVu Sans Mono', 'Liberation Mono', monospace; }
    </style>
  </defs>
  <rect width="1560" height="480" fill="#0C0D10"/>

  <text class="t" x="64" y="64" font-size="19" font-weight="600" fill="#ECEDEF">One call, one gate</text>
  <text class="m" x="64" y="90" font-size="12.5" fill="#69707C">plugin → host-stamped bridge → kernel checklist → filesystem</text>

  <!-- plugin frame -->
  <rect x="64" y="120" width="420" height="240" rx="12" fill="#15171C" stroke="#23262E"/>
  <text class="m" x="88" y="152" font-size="12" fill="#9BA1A9">wzp://zero.memo/</text>
  <rect x="88" y="166" width="372" height="158" rx="8" fill="#121418"/>
  <text class="m" x="104" y="196" font-size="12.5" fill="#C9CDD4">await ctx.fs.writeFile(</text>
  <text class="m" x="104" y="220" font-size="12.5" fill="#C9CDD4">  'Memos/release-notes.md',</text>
  <text class="m" x="104" y="244" font-size="12.5" fill="#C9CDD4">  renderedHtml,</text>
  <text class="m" x="104" y="268" font-size="12.5" fill="#C9CDD4">);</text>
  <text class="m" x="104" y="306" font-size="11.5" fill="#4B515C">// sandboxed iframe — no net, no DOM escape</text>

  <!-- bridge -->
  <line x1="484" y1="240" x2="664" y2="240" stroke="#39404B" stroke-width="1.6" marker-end="url(#sArrow)"/>
  <text class="m" x="574" y="218" font-size="11.5" fill="#8A9098" text-anchor="middle">wz-rpc</text>
  <text class="m" x="574" y="262" font-size="11" fill="#4B515C" text-anchor="middle">__plugin stamped here</text>

  <!-- kernel gate -->
  <rect x="664" y="120" width="420" height="240" rx="12" fill="#16203A33" stroke="#2E4372"/>
  <text class="t" x="688" y="154" font-size="13.5" font-weight="600" fill="#7AA2FF">kernel gate</text>
  <text class="t" x="688" y="192" font-size="12.5" fill="#46A758">✓ <tspan fill="#B9BEC6">caller is who it claims (host-stamped)</tspan></text>
  <text class="t" x="688" y="222" font-size="12.5" fill="#46A758">✓ <tspan fill="#B9BEC6">grant workspace:write approved at install</tspan></text>
  <text class="t" x="688" y="252" font-size="12.5" fill="#46A758">✓ <tspan fill="#B9BEC6">path canonicalizes inside the workspace</tspan></text>
  <text class="t" x="688" y="300" font-size="12" fill="#69707C">deny-by-default: the manifest is a closed set.</text>
  <text class="t" x="688" y="324" font-size="12" fill="#69707C">widened permission on upgrade → re-approval.</text>

  <!-- outcomes -->
  <line x1="1084" y1="195" x2="1220" y2="168" stroke="#39404B" stroke-width="1.6" marker-end="url(#sArrow)"/>
  <line x1="1084" y1="285" x2="1220" y2="312" stroke="#39404B" stroke-width="1.6" marker-end="url(#sArrow)"/>

  <rect x="1228" y="120" width="268" height="96" rx="12" fill="#13251B" stroke="#1F4630"/>
  <text class="t" x="1252" y="152" font-size="12.5" font-weight="600" fill="#46A758">allowed</text>
  <text class="m" x="1252" y="178" font-size="11.5" fill="#8FCF9A">Memos/release-notes.md</text>
  <text class="m" x="1252" y="198" font-size="11.5" fill="#8FCF9A">written atomically ✓</text>

  <rect x="1228" y="264" width="268" height="96" rx="12" fill="#261517" stroke="#4A2428"/>
  <text class="t" x="1252" y="296" font-size="12.5" font-weight="600" fill="#E05B5B">denied</text>
  <text class="m" x="1252" y="322" font-size="11.5" fill="#C98A8A">kernel/permission-denied</text>
  <text class="m" x="1252" y="342" font-size="11.5" fill="#C98A8A">→ approval UI in the shell</text>

  <text class="m" x="64" y="428" font-size="11.5" fill="#4B515C">tokens: issued once, constant-time compared, never in logs · tool-call ids: unguessable uuids, ownership-checked before acceptance</text>
</svg>
