<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" role="img" aria-label="Workbench Zero — Your workbench. From zero.">
  <!-- GitHub social preview (1280×640). Same vocabulary as banner.svg. -->
  <defs>
    <linearGradient id="spBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1120"/>
      <stop offset="1" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="spRing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#818CF8"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="url(#spBg)"/>

  <!-- mark -->
  <g transform="translate(150,150)">
    <line x1="0" y1="250" x2="340" y2="250" stroke="#E2E8F0" stroke-width="20" stroke-linecap="round"/>
    <circle cx="170" cy="122" r="110" fill="none" stroke="url(#spRing)" stroke-width="46"/>
    <rect x="62" y="278" width="38" height="38" rx="9" fill="#38BDF8"/>
    <rect x="151" y="278" width="38" height="38" rx="9" fill="#818CF8"/>
    <rect x="240" y="278" width="38" height="38" rx="9" fill="#E2E8F0"/>
  </g>

  <text x="580" y="280" font-family="system-ui, sans-serif" font-size="72" font-weight="800" fill="#F8FAFC">Workbench Zero</text>
  <text x="582" y="340" font-family="system-ui, sans-serif" font-size="30" fill="#94A3B8">Your workbench. From zero.</text>
  <g font-family="ui-monospace, monospace" font-size="21" fill="#38BDF8">
    <text x="582" y="420">local-first · plugin kernel · demos? no — durable</text>
  </g>
  <rect x="582" y="452" width="250" height="44" rx="22" fill="none" stroke="#334155" stroke-width="2"/>
  <text x="612" y="481" font-family="ui-monospace, monospace" font-size="20" fill="#E2E8F0">v1.0.0 · MIT</text>
</svg>
