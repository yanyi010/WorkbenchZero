<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="Workbench Zero logo">
  <!-- Workbench Zero — the zero rests on the workbench; modules are plugin slots. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E293B"/>
      <stop offset="1" stop-color="#0B1120"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#818CF8"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" rx="230" fill="url(#bg)"/>
  <!-- workbench surface -->
  <line x1="168" y1="712" x2="856" y2="712" stroke="#E2E8F0" stroke-width="42" stroke-linecap="round"/>
  <!-- the zero, seated on the surface -->
  <circle cx="512" cy="452" r="234" fill="none" stroke="url(#ring)" stroke-width="98"/>
  <!-- plugin slots on the bench -->
  <rect x="300" y="764" width="74" height="74" rx="18" fill="#38BDF8"/>
  <rect x="475" y="764" width="74" height="74" rx="18" fill="#818CF8"/>
  <rect x="650" y="764" width="74" height="74" rx="18" fill="#E2E8F0"/>
</svg>
