<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="Workbench Zero logo">
  <!-- Mark: the zero rests on a bench; the beam carries three plugin modules.
       Flat engineered surfaces, a single accent. No gloss. -->
  <defs>
    <linearGradient id="lzRing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6E98FF"/>
      <stop offset="1" stop-color="#4F74E8"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" rx="224" fill="#101217"/>
  <rect x="8" y="8" width="1008" height="1008" rx="218" fill="none" stroke="#242832" stroke-width="2"/>

  <!-- the zero, seated on the beam -->
  <circle cx="512" cy="398" r="206" fill="none" stroke="url(#lzRing)" stroke-width="88"/>

  <!-- beam -->
  <rect x="170" y="660" width="684" height="58" rx="29" fill="#2A2F3A"/>

  <!-- plugin modules slotted under the bench -->
  <rect x="300" y="754" width="92" height="92" rx="22" fill="#5E8CFF"/>
  <rect x="466" y="754" width="92" height="92" rx="22" fill="#8FB0FF"/>
  <rect x="632" y="754" width="92" height="92" rx="22" fill="#3D4450"/>
</svg>
