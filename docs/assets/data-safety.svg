<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 560" role="img" aria-label="Data safety: three crash stories, three endings">
  <style>
    .t { font-family: Inter, 'Liberation Sans', 'DejaVu Sans', sans-serif; }
    .m { font-family: 'DejaVu Sans Mono', 'Liberation Mono', monospace; }
  </style>
  <rect width="1560" height="560" fill="#0C0D10"/>

  <text class="t" x="64" y="66" font-size="19" font-weight="600" fill="#ECEDEF">Built for the day something goes wrong</text>
  <text class="m" x="64" y="92" font-size="12.5" fill="#69707C">crash tests are the spec — each ending has a regression test</text>

  <!-- story 1 -->
  <g>
    <rect x="64" y="120" width="472" height="300" rx="12" fill="#15171C" stroke="#23262E"/>
    <text class="t" x="92" y="156" font-size="14" font-weight="600" fill="#ECEDEF">Power loss mid-write</text>
    <text class="m" x="92" y="180" font-size="11.5" fill="#69707C">the story every editor eventually tells</text>
    <rect x="92" y="200" width="416" height="120" rx="8" fill="#121418"/>
    <text class="m" x="108" y="228" font-size="12" fill="#C9CDD4">write → tasks.json.tmp-4f2a…</text>
    <text class="m" x="108" y="252" font-size="12" fill="#C9CDD4">flush → fsync</text>
    <text class="m" x="108" y="276" font-size="12" fill="#C9CDD4">rename over tasks.json ⚡ <tspan fill="#E05B5B">power</tspan></text>
    <text class="m" x="108" y="300" font-size="12" fill="#69707C">fsync(parent dir) at close</text>
    <text class="t" x="92" y="368" font-size="13" fill="#46A758">✓ next boot: old or new, never torn</text>
    <text class="m" x="92" y="394" font-size="11.5" fill="#69707C">leftover tmp siblings heal on next read</text>
  </g>

  <!-- story 2 -->
  <g>
    <rect x="560" y="120" width="472" height="300" rx="12" fill="#15171C" stroke="#23262E"/>
    <text class="t" x="588" y="156" font-size="14" font-weight="600" fill="#ECEDEF">A state file goes bad</text>
    <text class="m" x="588" y="180" font-size="11.5" fill="#69707C">disk rot, other tools, hand edits</text>
    <rect x="588" y="200" width="416" height="120" rx="8" fill="#121418"/>
    <text class="m" x="604" y="228" font-size="12" fill="#E05B5B">settings.json: unexpected EOF</text>
    <text class="m" x="604" y="252" font-size="12" fill="#C9CDD4">→ settings.json.corrupt-1727…</text>
    <text class="m" x="604" y="276" font-size="12" fill="#C9CDD4">→ fresh defaults in its place</text>
    <text class="m" x="604" y="300" font-size="12" fill="#C9CDD4">→ toast: where your file went</text>
    <text class="t" x="588" y="368" font-size="13" fill="#46A758">✓ quarantined — never silently reset</text>
    <text class="m" x="588" y="394" font-size="11.5" fill="#69707C">deleted by you, not by us</text>
  </g>

  <!-- story 3 -->
  <g>
    <rect x="1056" y="120" width="472" height="300" rx="12" fill="#15171C" stroke="#23262E"/>
    <text class="t" x="1084" y="156" font-size="14" font-weight="600" fill="#ECEDEF">The index goes bad</text>
    <text class="m" x="1084" y="180" font-size="11.5" fill="#69707C">search index is derived by design</text>
    <rect x="1084" y="200" width="416" height="120" rx="8" fill="#121418"/>
    <text class="m" x="1100" y="228" font-size="12" fill="#E05B5B">PRAGMA integrity_check: fail</text>
    <text class="m" x="1100" y="252" font-size="12" fill="#C9CDD4">→ snapshot copy moved aside</text>
    <text class="m" x="1100" y="276" font-size="12" fill="#C9CDD4">→ index rebuilt from your files</text>
    <text class="m" x="1100" y="300" font-size="12" fill="#69707C">in .workbench/backups/ — yours to inspect</text>
    <text class="t" x="1084" y="368" font-size="13" fill="#46A758">✓ the workspace opens anyway</text>
    <text class="m" x="1084" y="394" font-size="11.5" fill="#69707C">WAL · busy_timeout · synchronous=NORMAL</text>
  </g>

  <!-- rotation rail -->
  <text class="t" x="64" y="462" font-size="10.5" font-weight="600" fill="#69707C" letter-spacing="1.6">AUTOMATIC SNAPSHOTS · keeps 10 by default (core.backup.keep)</text>
  <g class="m" font-size="11.5">
    <rect x="64" y="478" width="176" height="30" rx="6" fill="#232833"/><text x="80" y="498" fill="#9BA1A9">0919-2045</text>
    <rect x="256" y="478" width="176" height="30" rx="6" fill="#232833"/><text x="272" y="498" fill="#9BA1A9">0920-0900</text>
    <rect x="448" y="478" width="176" height="30" rx="6" fill="#232833"/><text x="464" y="498" fill="#9BA1A9">0921-0900</text>
    <rect x="640" y="478" width="176" height="30" rx="6" fill="#232833"/><text x="656" y="498" fill="#9BA1A9">0922-0900</text>
    <rect x="832" y="478" width="176" height="30" rx="6" fill="#16203A" stroke="#2E4372"/><text x="848" y="498" fill="#7AA2FF">0923-0900 ✓</text>
    <text x="1036" y="498" fill="#4B515C" class="m">restore swaps the directory atomically — pre-restore state kept aside</text>
  </g>
</svg>
