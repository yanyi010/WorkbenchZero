name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  # Never cancel a half-published release.
  group: release
  cancel-in-progress: false

jobs:
  guard:
    # Cheap gate before spending 30 minutes on builders.
    name: Version guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Tag must match the packaged version and CHANGELOG
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")
          ROOT=$(node -p "require('./package.json').version")
          CARGO=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          echo "tag=$TAG tauri=$PKG root=$ROOT cargo=$CARGO"
          [ "$TAG" = "$PKG" ] && [ "$TAG" = "$ROOT" ] && [ "$TAG" = "$CARGO" ] || {
            echo "tag/version mismatch — bump all versions to $TAG first" >&2
            exit 1
          }
          grep -q "^## \[$TAG\]" CHANGELOG.md || {
            echo "CHANGELOG.md has no [$TAG] section" >&2
            exit 1
          }

  publish:
    needs: guard
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            .

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libfuse2

      - name: Install frontend dependencies
        run: npm ci

      - name: Quality gates (release builds are tested builds)
        run: |
          cargo test --workspace --locked
          npm run typecheck
          npm test

      - name: Extract release notes from CHANGELOG
        run: |
          python3 - <<'EOF'
          import os, re
          tag = os.environ["GITHUB_REF_NAME"].lstrip("v")
          text = open("CHANGELOG.md").read()
          m = re.search(rf"^## \[{re.escape(tag)}\].*?\n(.*?)(?=^## \[|\Z)", text, re.M | re.S)
          body = m.group(1).strip() if m else "See CHANGELOG.md."
          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write("RELEASE_BODY<<EOF_BODY\n" + body + "\nEOF_BODY\n")
          EOF

      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: v__VERSION__
          releaseName: 'Workbench Zero __VERSION__'
          releaseBody: ${{ env.RELEASE_BODY }}
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true

      - name: SHA256SUMS for all bundle artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          cd apps/desktop/src-tauri/target/release/bundle
          find . -type f \( -name '*.deb' -o -name '*.AppImage' -o -name '*.tar.gz' -o -name '*.sig' -o -name '*.json' \) \
            | sort | xargs sha256sum > "$GITHUB_WORKSPACE/SHA256SUMS.txt"
          cd "$GITHUB_WORKSPACE"
          # The release exists (draft) at this point; attach the manifest.
          gh release upload "$TAG" SHA256SUMS.txt --clobber
          echo "--- SHA256SUMS.txt"; cat SHA256SUMS.txt
