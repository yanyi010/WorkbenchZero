name: CI

on:
  push:
    branches: [main, dev/*]
  pull_request:

jobs:
  js:
    name: TypeScript (typecheck · lint · test · build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  rust:
    name: Rust (fmt · clippy · test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  wb-cli:
    name: wb CLI smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: scaffold → validate → build → pack → verify zip
        run: |
          set -euo pipefail
          cd "$(mktemp -d)"
          npx --prefix "$GITHUB_WORKSPACE" wb plugin create demo-notes
          wb() { node "$GITHUB_WORKSPACE/packages/devtools/src/wb.mjs" "$@"; }
          wb plugin validate demo-notes
          wb plugin build demo-notes
          wb plugin pack demo-notes
          python3 - <<'EOF'
          import glob, zipfile
          zips = glob.glob('demo-notes/*.wzplugin.zip')
          assert zips, 'no .wzplugin.zip produced'
          z = zipfile.ZipFile(zips[0])
          assert 'plugin.json' in z.namelist(), 'plugin.json missing from archive'
          assert z.testzip() is None, 'crc failure'
          print('wzplugin zip ok:', zips[0])
          EOF

  plugins:
    name: First-party plugin manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: validate all manifests
        run: |
          for d in plugins/*/ examples/*/; do
            node packages/devtools/src/wb.mjs plugin validate "$d"
          done
