[workspace]
resolver = "2"
members = [
  "crates/common",
  "crates/permissions",
  "crates/commands",
  "crates/events",
  "crates/settings",
  "crates/storage",
  "crates/secrets",
  "crates/artifacts",
  "crates/search",
  "crates/workspace",
  "crates/plugin-runtime",
  "crates/kernel",
  "crates/mcp-server",
  "apps/desktop/src-tauri",
]

[workspace.package]
version = "1.0.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
authors = ["Workbench Zero contributors"]

[workspace.dependencies]
wz-common = { path = "crates/common" }
wz-permissions = { path = "crates/permissions" }
wz-commands = { path = "crates/commands" }
wz-events = { path = "crates/events" }
wz-settings = { path = "crates/settings" }
wz-storage = { path = "crates/storage" }
wz-secrets = { path = "crates/secrets" }
wz-artifacts = { path = "crates/artifacts" }
wz-search = { path = "crates/search" }
wz-workspace = { path = "crates/workspace" }
wz-plugin-runtime = { path = "crates/plugin-runtime" }
wz-kernel = { path = "crates/kernel" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.40", features = ["bundled"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json", "blocking"] }
futures-util = "0.3"
portable-pty = "0.8"
notify = "6"
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
tracing-appender = "0.2"
dirs = "5"
sha2 = "0.10"
zip = "2"
walkdir = "2"
once_cell = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
